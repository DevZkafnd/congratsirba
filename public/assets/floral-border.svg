<svg width="120" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rose flower pattern -->
    <g id="rose">
      <circle cx="30" cy="30" r="12" fill="#f87171" opacity="0.6"/>
      <circle cx="30" cy="30" r="8" fill="#fb7185" opacity="0.7"/>
      <circle cx="30" cy="30" r="4" fill="#fda4af" opacity="0.8"/>
      <ellipse cx="26" cy="28" rx="3" ry="4" fill="#fecdd3" opacity="0.6" transform="rotate(-20 26 28)"/>
      <ellipse cx="34" cy="28" rx="3" ry="4" fill="#fecdd3" opacity="0.6" transform="rotate(20 34 28)"/>
      <ellipse cx="30" cy="35" rx="4" ry="3" fill="#fecdd3" opacity="0.6"/>
    </g>
    
    <!-- Leaf pattern -->
    <g id="leaf">
      <ellipse cx="20" cy="20" rx="8" ry="15" fill="#86efac" opacity="0.5" transform="rotate(-30 20 20)"/>
      <path d="M 20 10 Q 23 20 20 30" stroke="#22c55e" stroke-width="1" fill="none" opacity="0.7"/>
    </g>
    
    <!-- Small bud -->
    <g id="bud">
      <ellipse cx="15" cy="15" rx="5" ry="7" fill="#fca5a5" opacity="0.7"/>
      <ellipse cx="15" cy="15" rx="3" ry="5" fill="#fecdd3" opacity="0.8"/>
    </g>
  </defs>
  
  <!-- Pattern repeating down -->
  <use href="#rose" x="20" y="30"/>
  <use href="#leaf" x="15" y="55" transform="rotate(-15 35 70)"/>
  <use href="#bud" x="35" y="80"/>
  
  <use href="#rose" x="25" y="130"/>
  <use href="#leaf" x="20" y="155"/>
  <use href="#bud" x="30" y="180"/>
  
  <use href="#rose" x="20" y="230"/>
  <use href="#leaf" x="15" y="255" transform="rotate(-15 35 270)"/>
  <use href="#bud" x="35" y="280"/>
  
  <use href="#rose" x="25" y="330"/>
  <use href="#leaf" x="20" y="355"/>
</svg>
